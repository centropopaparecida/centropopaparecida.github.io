<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Centro POP</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centro POP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #eef3f1; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #eef3f1; }
  #carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #16323f; }
</style>
</head>
<body>
<div id="carregando">Abrindo o Centro POP…</div>
<script>
  // Endereço do aplicativo (implantação do Apps Script)
  var APP = 'https://script.google.com/macros/s/AKfycby_xn4hgHSew9fNpXVdgLnTAbcuJny9nfR8B-Pfjrp1FeCAavRXTpraUr9yd8dWdq_F/exec';
  // Repassa o código do aparelho vinculado (?d=...) para o aplicativo
  var d = new URLSearchParams(location.search).get('d');
  var src = APP + (d && /^[a-f0-9]{64}$/.test(d) ? '?d=' + d : '');
  var f = document.createElement('iframe');
  f.src = src;
  f.title = 'Centro POP';
  f.allow = 'microphone; camera; clipboard-write; geolocation';
  f.onload = function () { var c = document.getElementById('carregando'); if (c) c.remove(); };
  document.body.appendChild(f);
</script>
</body>
</html>
